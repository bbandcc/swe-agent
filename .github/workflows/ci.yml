name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Keep platform/capability skip reasons visible without pinning a count.
      PYTEST_ADDOPTS: "-rs"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"

      - name: Sync locked project environment
        timeout-minutes: 15
        run: |
          uv --version
          uv sync --locked
          uv run --locked python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"

      - name: Run supported core and refusal unittest selection
        timeout-minutes: 20
        run: uv run --locked python -m tests.test_s5d2_ci_contract --suite unittest

      - name: Run the same supported pytest selection with skip reasons
        timeout-minutes: 20
        run: uv run --locked python -m tests.test_s5d2_ci_contract --suite pytest

      - name: Compile production and test packages
        timeout-minutes: 3
        run: uv run --locked python -m compileall -q agent tests
