[project]
name = "swe-agent-langgraph"
version = "0.1.0"
description = "LangGraph software engineering agent with validated workspace editing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.1",
    "langchain-deepseek>=1.1.0",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.2.11",
    "gitingest>=0.1.2",
    "tree-sitter-languages>=1.10.2",
    "tree-sitter==0.21.3",
    "diff-match-patch>=20241021",
    "thefuzz>=0.22.1",
    "fuzzysearch>=0.7.3",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "helpers*"]

[tool.setuptools.package-data]
"*" = ["prompts/*.md"]
